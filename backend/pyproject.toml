[project]
name = "reconai"
version = "0.1.0"
description = "ReconAI - AI Finance Controller"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.8.0",
    "faker>=26.0.0",
    "scikit-learn>=1.3.0",
    "rapidfuzz>=3.5.0",
    "fastapi>=0.100.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.31.0",
    "razorpay>=1.4.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "google-genai>=0.1.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.24.0",
]

[tool.setuptools]
packages = ["app"]
